<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <pattern id="gridL4" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#152238" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1080" height="1080" fill="#F8F5EF" />
  <rect width="1080" height="1080" fill="url(#gridL4)" />

  <g font-family="'Pretendard Variable', 'Malgun Gothic', 'Segoe UI', sans-serif">
    <text x="96" y="180" font-size="24" font-weight="700" letter-spacing="5" fill="#FF6B57">PROBLEM 02</text>
    <rect x="98" y="204" width="64" height="5" rx="2.5" fill="#FF6B57" />

    <text x="92" y="316" font-size="58" font-weight="800" letter-spacing="-2.5" fill="#152238">그 시간 안에서도, <tspan fill="#FF6B57">3D 배치</tspan>는</text>
    <text x="92" y="392" font-size="58" font-weight="800" letter-spacing="-2.5" fill="#152238">특히 손이 많이 갑니다</text>

    <!-- 문제 카드 3개 -->
    <g>
      <rect x="96" y="452" width="888" height="150" rx="24" fill="#FFFFFF" stroke="#D8DDE5" />
      <text x="140" y="512" font-size="30" font-weight="800" fill="#FF6B57">01</text>
      <text x="210" y="512" font-size="32" font-weight="800" letter-spacing="-0.5" fill="#152238">빈 인형에서 시작</text>
      <text x="210" y="558" font-size="26" font-weight="500" letter-spacing="-0.3" fill="#667085">컷마다 관절과 몸의 방향을 처음부터 잡아야 합니다.</text>
    </g>
    <g>
      <rect x="96" y="622" width="888" height="150" rx="24" fill="#FFFFFF" stroke="#D8DDE5" />
      <text x="140" y="682" font-size="30" font-weight="800" fill="#FF6B57">02</text>
      <text x="210" y="682" font-size="32" font-weight="800" letter-spacing="-0.5" fill="#152238">맞는 포즈 에셋 탐색</text>
      <text x="210" y="728" font-size="26" font-weight="500" letter-spacing="-0.3" fill="#667085">수많은 포즈 중 콘티와 가까운 것을 하나씩 찾아 비교합니다.</text>
    </g>
    <g>
      <rect x="96" y="792" width="888" height="150" rx="24" fill="#FFFFFF" stroke="#D8DDE5" />
      <text x="140" y="852" font-size="30" font-weight="800" fill="#FF6B57">03</text>
      <text x="210" y="852" font-size="32" font-weight="800" letter-spacing="-0.5" fill="#152238">작화 전 반복 배치</text>
      <text x="210" y="898" font-size="26" font-weight="500" letter-spacing="-0.3" fill="#667085">위치와 카메라를 맞춘 뒤에야 실제 밑그림을 시작합니다.</text>
    </g>

    <!-- footer -->
    <text x="96" y="1010" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#152238">그리기도 전에, 포즈를 만드는 시간이 쌓입니다.</text>
    <text x="984" y="1010" text-anchor="end" font-size="24" font-weight="600" letter-spacing="1" fill="#A7AFBD">04 / 06</text>
  </g>
</svg>
