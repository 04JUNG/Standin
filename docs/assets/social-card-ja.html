<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Standin Japanese social card — 1200 × 630</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; color: #152238; font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
main { position: relative; width: 1200px; height: 630px; overflow: hidden; background-color: #f8f5ef; background-image: linear-gradient(#1522380c 1px, transparent 1px), linear-gradient(90deg, #1522380c 1px, transparent 1px); background-size: 48px 48px; padding: 54px 60px; }
.eyebrow { font: 700 15px sans-serif; letter-spacing: 2px; color: #e95543; }
h1 { font-size: 54px; letter-spacing: -2px; line-height: 1.35; margin: 32px 0 16px; }
p { font-size: 22px; line-height: 1.8; margin: 0; font-weight: 500; }
.badge { display: inline-block; margin-top: 28px; border: 1px solid #d8dde5; border-radius: 24px; padding: 10px 20px; background: #fff; font-size: 15px; font-weight: 700; }
.brand { position: absolute; bottom: 48px; left: 60px; font: 800 34px sans-serif; }
.brand span { color: #ff6b57; }
.visual { position: absolute; right: 36px; top: 32px; width: 470px; height: 566px; border-radius: 30px; background: #e9edf1; overflow: hidden; }
.visual img { position: absolute; top: 16px; left: 32px; width: 406px; height: 542px; object-fit: contain; }
.visual .rough { clip-path: inset(0 50% 0 0); }
.visual .model { clip-path: inset(0 0 0 50%); }
.divider { position: absolute; left: 50%; top: 60px; bottom: 32px; width: 3px; background: #ff6b57; }
.label { position: absolute; top: 22px; font: 700 13px sans-serif; letter-spacing: 2px; }
.label.left { left: 48px; } .label.right { right: 52px; }
</style>
<main>
  <div class="eyebrow">MANGA · 3D POSE ASSISTANT</div>
  <h1>ラフから、<br>イメージに近い<br>3Dポーズを。</h1>
  <p>候補を選んで、調整して。<br>いつもの作画につなげよう。</p>
  <div class="badge">オープンベータ公開中 · Windows / macOS</div>
  <div class="brand">Stand<span>in.</span></div>
  <div class="visual">
    <img class="rough" src="/assets/hero-poses/realistic-v2/action-rough.webp" alt="">
    <img class="model" src="/assets/hero-poses/realistic-v2/action-mannequin.webp" alt="">
    <div class="divider"></div><span class="label left">ROUGH</span><span class="label right">3D POSE</span>
  </div>
</main>
</html>
