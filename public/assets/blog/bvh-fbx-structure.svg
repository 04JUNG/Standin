<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">BVH와 FBX가 담는 정보</title><desc id="desc">BVH는 골격과 프레임별 움직임을 담는다. FBX는 모델, 골격, 재질, 애니메이션 등 여러 데이터를 담을 수 있다.</desc>
